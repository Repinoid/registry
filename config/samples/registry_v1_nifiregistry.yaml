apiVersion: registry.nifi.oper/v1
kind: NifiRegistry
metadata:
  name: nifiregistry-sample
spec:
  # Size - количество реплик (изменено)
  size: 1
  
  # Используем структуру ImageSpec
  image:
    repository: apache/nifi-registry
    tag: 1.24.0

  # Resources - ДОБАВЛЕНО для устранения ошибки в Deployment Helper
  resources:
    limits:
      cpu: "500m"
      memory: "1Gi"
    requests:
      cpu: "100m"
      memory: "512Mi"

  # Tls (ОТКЛЮЧЕНО)
  tls:
    enabled: false
    port: 8443
    host: nifiregistry-sample-svc.default.svc.cluster.local
    keystorePassword: changeit
    truststorePassword: changeit
    adminIdentity: "root"

  # Настройки Keycloak OIDC (Оставлено для совместимости с CRD)
  keycloak:
    discoveryUrl: "https://keycloak:8443/realms/nifi-registry/.well-known/openid-configuration"
    clientId: "nifi-registry-client"
    claimIdentifyingUser: "preferred_username"
    clientSecretName: nifiregistry-keycloak-secret

  # Настройки Flow Storage (хранение версий потоков)
  flowStorage:
    enabled: true
    size: 200Mi
    storageClass: local-path # <--- ИСПРАВЛЕНО: Для устранения ошибки Pending

  # Настройки Lib Storage (ДОБАВЛЕНО/АКТИВИРОВАНО для устранения ошибки PVC)
  libStorage:
    enabled: true # <--- ДОБАВЛЕНО/ИСПРАВЛЕНО: Гарантирует создание PVC -lib
    size: 200Mi
    storageClass: local-path # <--- ИСПРАВЛЕНО: Для устранения ошибки Pending

  # АКТИВАЦИЯ ВНЕШНЕЙ БАЗЫ ДАННЫХ (PostgreSQL)
  database:
    enabled: false # Используем встроенную БД Derby (как в оригинале)
    url: jdbc:postgresql://postgres:5432/nifiregistry 
    driverClass: org.postgresql.Driver
    username: nifiregistry
    # Мы добавили Password в types.go, но здесь он не нужен, так как enabled: false.
    # secretName: nifiregistry-db-secret