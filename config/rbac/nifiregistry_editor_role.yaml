# permissions for end users to edit nifiregistries.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: clusterrole
    app.kubernetes.io/instance: nifiregistry-editor-role
    app.kubernetes.io/component: rbac
    app.kubernetes.io/created-by: nreg-oper
    app.kubernetes.io/part-of: nreg-oper
    app.kubernetes.io/managed-by: kustomize
  name: nifiregistry-editor-role
rules:
- apiGroups:
  - registry.nifi.oper
  resources:
  - nifiregistries
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - registry.nifi.oper
  resources:
  - nifiregistries/status
  verbs:
  - get
